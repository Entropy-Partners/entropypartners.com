<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b0f">
<meta name="robots" content="noindex">
<title>Entropy Partners</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f;
    --fg: #d9d6cf;
    --fg-mid: #b3b0a9;
    --accent: #eba25a;
    --rule: rgba(217, 214, 207, 0.16);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main { text-align: center; }
  p { margin: 0 0 14px; font-size: 15px; font-weight: 300; }
  a {
    color: var(--fg-mid);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  a:hover { color: var(--accent); border-color: currentColor; }
  a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 1px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
  <main>
    <p>Nothing here.</p>
    <a href="/">Entropy Partners</a>
  </main>
</body>
</html>
